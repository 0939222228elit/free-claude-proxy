name: Keep Alive Render Service

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service Health
        run: |
          response=$(curl -s https://free-claude-code-proxy-kwbo.onrender.com/health)
          echo "Health response: $response"
