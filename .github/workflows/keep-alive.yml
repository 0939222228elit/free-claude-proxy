name: Keep Alive Render Service

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Service Health
        run: |
          response=$(curl -s https://free-claude-code-proxy-kwbo.onrender.com/health)
          echo "Render Health response: $response"

      - name: Ping Supabase Storage & Database
        run: |
          sb_response=$(curl -s https://hrxmvitapcwfubcdaomu.supabase.co/storage/v1/object/public/projects/test.txt)
          echo "Supabase response: $sb_response"
